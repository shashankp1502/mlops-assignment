{{- if .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heart-risk-api.fullname" . }}-prometheus
  labels:
    {{- include "heart-risk-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "heart-risk-api.name" . }}-prometheus
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "heart-risk-api.name" . }}-prometheus
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
      volumes:
        - name: config
          configMap:
            name: {{ include "heart-risk-api.fullname" . }}-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "heart-risk-api.fullname" . }}-prometheus
  labels:
    {{- include "heart-risk-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "heart-risk-api.name" . }}-prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.monitoring.prometheus.port }}
      targetPort: 9090
      nodePort: {{ .Values.monitoring.prometheus.nodePort }}
{{- end }}
